  <script>
    // Google Sign-In (100 KiB) and the OneSignal page SDK (44 KiB) are not needed for the first
    // paint, so they load after the page has loaded, when the browser is idle. OneSignal calls
    // are queued on OneSignalDeferred until its SDK arrives, so no call is lost.
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.oneSignalUnavailable = false;
    (function () {
      var loadScript = function (src, onError) {
        var script = document.createElement("script");
        script.src = src;
        script.async = true;
        if (onError) script.onerror = onError;
        document.head.appendChild(script);
      };
      var loadThirdPartyScripts = function () {
        loadScript("https://accounts.google.com/gsi/client");
        loadScript("https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js", function () {
          window.oneSignalUnavailable = true;
          console.warn("OneSignal page SDK failed to load. Continuing without push support.");
        });
      };
      var whenIdle = function () {
        (window.requestIdleCallback || function (callback) { setTimeout(callback, 1); })(loadThirdPartyScripts, { timeout: 3000 });
      };
      if (document.readyState === "complete") whenIdle();
      else window.addEventListener("load", whenIdle, { once: true });
    })();
  </script>
