<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
  <link rel="icon" type="image/png" sizes="64x64" href="{{faviconUrl}}">
            <link rel="icon" href="{{faviconUrl}}">
            <link rel="shortcut icon" href="{{faviconUrl}}">
          
  <link rel="apple-touch-icon" sizes="180x180" href="{{appleTouchUrl}}">

  <meta name="keywords" content="{{metaKeywords}}">

  <meta property="og:description" content="{{metaDescription}}">

  <title>{{metaTitle}}</title>
  <meta name="project-alias" content="{{alias}}">
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "{{projectName}}",
            "url": "{{pageUrl}}",
            "logo": "{{faviconUrl}}"
          }

  <!-- <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"> -->
  <!-- origins the page needs before it can paint: API, cache server and the two image hosts -->
  <link rel="preconnect" href="https://deploy.freeschema.com" crossorigin>
  <link rel="preconnect" href="https://boomconsole.com" crossorigin>
  <link rel="preconnect" href="https://s3cdn.boomconcole.com">
  <link rel="preconnect" href="https://boomconcole.com">
  <script>
    // Google Sign-In (100 KiB) and the OneSignal page SDK (44 KiB) are not needed for the first
    // paint, so they load after the page has loaded, when the browser is idle. OneSignal calls
    // are queued on OneSignalDeferred until its SDK arrives, so no call is lost.
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.oneSignalUnavailable = false;
    (function () {
      var loadScript = function (src, onError) {
        var script = document.createElement("script");
        script.src = src;
        script.async = true;
        if (onError) script.onerror = onError;
        document.head.appendChild(script);
      };
      var loadThirdPartyScripts = function () {
        loadScript("https://accounts.google.com/gsi/client");
        loadScript("https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js", function () {
          window.oneSignalUnavailable = true;
          console.warn("OneSignal page SDK failed to load. Continuing without push support.");
        });
      };
      var whenIdle = function () {
        (window.requestIdleCallback || function (callback) { setTimeout(callback, 1); })(loadThirdPartyScripts, { timeout: 3000 });
      };
      if (document.readyState === "complete") whenIdle();
      else window.addEventListener("load", whenIdle, { once: true });
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    .firework-gif-ad {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    @media (max-width:568px) {
      .firework-gif-ad {
        width: 150px;
      }
    }
      {{cssCache}}
  </style>
  <script type="module" crossorigin src="https://cdn.jsdelivr.net/gh/nischaldev/appbuilder-build@main/assets/index-Cbj_3f3J.js"></script>
  <link rel="modulepreload" crossorigin href="https://cdn.jsdelivr.net/gh/nischaldev/appbuilder-build@main/assets/mftsccs-browser-7RQAod5l.js">
  <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/nischaldev/appbuilder-build@main/assets/index-BydaCWnD.css">
</head>

<body>
  <div id="app" data-server-cache="{{serverCachePageId}}">
    {{htmlCache}}
  </div>
  <script>
    (function() {
      const ensureLoadingStyles = () => {
        if (document.getElementById('app-loader-styles')) {
          return;
        }

        const style = document.createElement('style');
        style.id = 'app-loader-styles';
        style.textContent = `
          .firework-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
          }

          .firework-loader-spinner {
            position: absolute;
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: firework-loader-spin 0.8s linear infinite;
            z-index: 1;
            transition: opacity 0.2s ease;
          }

          .firework-loader-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.25s ease;
            background: #000;
          }

          .firework-loader.is-ready .firework-loader-spinner {
            opacity: 0;
          }

          .firework-loader.is-ready .firework-loader-video {
            opacity: 1;
          }

          @keyframes firework-loader-spin {
            to {
              transform: rotate(360deg);
            }
          }
        `;

        document.head.appendChild(style);
      };

      const loaderLogoUrl = "{{loaderLogoUrl}}";
      const fallbackLogoUrl = "{{logoUrl}}";
      const hasLoaderLogoUrl = loaderLogoUrl
        && !/^\s*\{\{.+\}\}\s*$/.test(loaderLogoUrl);
      const logoUrl = hasLoaderLogoUrl
        ? loaderLogoUrl
        : fallbackLogoUrl;
      const sanitizedLogoUrl = logoUrl.split('?')[0].split('#')[0].toLowerCase();
      const isVideoLogo = /\.(mp4|webm|ogg|mov|m4v)$/i.test(sanitizedLogoUrl);
      const defaultLogo = isVideoLogo
        ? '<div class="firework-loader" aria-live="polite" aria-busy="true"><div class="firework-loader-spinner" aria-hidden="true"></div><video class="firework-loader-video" autoplay muted loop playsinline preload="auto"><source src="' + logoUrl + '"></video></div>'
        : '<img src="' + logoUrl + '" alt="{{projectName}} logo" class="firework-gif-ad">';
      const app = document.getElementById('app');
      const hasVisibleCachedContent = () => {
        if (!app || !app.innerHTML.trim()) {
          return false;
        }

        if (app.textContent && app.textContent.trim()) {
          return true;
        }

        return Array.from(app.children).some((child) => {
          const rect = child.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0;
        });
      };

      // Show loading image only if the server did not provide visible cached HTML.
      if (app && !hasVisibleCachedContent()) {
        if (isVideoLogo) {
          ensureLoadingStyles();
        }

        app.innerHTML = defaultLogo;

        if (isVideoLogo) {
          const loader = app.querySelector('.firework-loader');
          const video = app.querySelector('.firework-loader-video');
          const revealVideo = () => {
            loader && loader.classList.add('is-ready');
          };

          if (video) {
            if (video.readyState >= 2) {
              revealVideo();
            } else {
              video.addEventListener('loadeddata', revealVideo, { once: true });
              video.addEventListener('canplay', revealVideo, { once: true });
              video.addEventListener('error', revealVideo, { once: true });
              setTimeout(revealVideo, 3000);
              video.load();
            }
          }
        }
      }
    })();
  </script>

</body>

</html>
